<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Listing</title>
    <link rel="stylesheet" href="/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"
      defer
    ></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Expense listing</h1>
      <p class="lede">
        Add expenses below. Data is saved to CSV on the server and summarized
        in the chart.
      </p>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Add expense</h2>
        <form id="expense-form" novalidate>
          <div class="field">
            <label for="item">Item</label>
            <input id="item" name="item" type="text" autocomplete="off" />
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input
              id="amount"
              name="amount"
              type="text"
              inputmode="decimal"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select category</option>
              <option>Shopping</option>
              <option>Travel</option>
              <option>Food</option>
              <option>Others</option>
            </select>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" />
          </div>
          <div class="form-actions">
            <button type="submit" id="submit-btn">Add to expense list</button>
          </div>
        </form>

        <div
          id="feedback"
          class="feedback"
          role="status"
          aria-live="polite"
        ></div>
      </section>

      <section class="panel chart-panel" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Totals by category</h2>
        <div class="chart-wrap">
          <canvas id="category-chart" height="220"></canvas>
        </div>
      </section>

      <section class="panel list-panel" aria-labelledby="list-heading">
        <h2 id="list-heading">Saved expenses</h2>
        <div class="table-scroll">
          <table class="expense-table">
            <thead>
              <tr>
                <th scope="col">Item</th>
                <th scope="col">Amount</th>
                <th scope="col">Category</th>
                <th scope="col">Date</th>
              </tr>
            </thead>
            <tbody id="expense-rows"></tbody>
          </table>
        </div>
        <p id="empty-hint" class="empty-hint hidden">
          No expenses yet. Add your first row above.
        </p>
      </section>
    </main>
  </body>
</html>
